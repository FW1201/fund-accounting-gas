<body>
  <a class="skip-link" href="#content">跳至主要內容</a>
  <section id="loginScreen" class="login-screen"><form id="loginForm" class="login-card"><div class="mark">金</div><h1>歡迎回到基金帳本</h1><p>請用管理帳號登入，安心記錄每一筆收支。</p><div class="field"><label for="loginName">帳號</label><input id="loginName" autocomplete="username" required></div><div class="field"><label for="loginPassword">密碼</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button id="loginButton" class="btn" type="submit">登入帳本</button></form></section>
  <div class="shell hidden" id="appShell">
    <header class="topbar no-print"><div class="brand"><div class="mark">金</div><div><strong>基金帳務</strong><small>清楚記錄每一筆收支</small></div></div>
      <nav class="nav" aria-label="主要選單"><button data-view="home" class="active">總覽</button><button data-view="transactions">收支明細</button><button data-view="accounting">會計管理</button><button data-view="report">A4 報表</button><button data-view="import">舊帳匯入</button><button data-view="settings">帳號設定</button></nav><div class="account-wrap"><div id="account" class="account"></div><button class="btn light" onclick="logoutUi()">登出</button></div></header>
    <main id="content"><div class="empty">載入帳本中…</div></main>
  </div>
  <dialog id="txDialog"><form id="txForm" class="dialog-body" method="dialog"><div class="dialog-title"><h2 id="dialogHeading">新增收支</h2><button type="button" class="close" aria-label="關閉" onclick="txDialog.close()">×</button></div>
    <input type="hidden" name="id"><div class="form-grid">
      <div class="field"><label for="txType">類型 *</label><select id="txType" name="type" required><option value="INCOME">收入</option><option value="EXPENSE">支出</option></select></div>
      <div class="field"><label for="txDate">國曆日期 *</label><input id="txDate" name="gregorianDate" type="date" min="1900-01-01" max="2100-12-31" required></div>
      <div class="field"><label for="txAmount">金額（新臺幣）*</label><input id="txAmount" name="amount" inputmode="decimal" placeholder="例如 1200 或 1200.50" required></div>
      <div class="field" id="categoryField"><label for="txCategory" id="categoryLabel">收入分類 *</label><select id="txCategory" name="category" required></select></div>
      <div class="field"><label for="txAccount">收付款帳戶 *</label><select id="txAccount" name="accountId" required></select></div>
      <div class="field"><label for="txFund">基金用途 *</label><select id="txFund" name="fundId" required></select></div>
      <div class="field"><label for="txVoucherNo">單據／收據編號</label><input id="txVoucherNo" name="voucherNo" maxlength="60"></div>
      <div class="field"><label for="txCounterparty">付款或收款對象</label><input id="txCounterparty" name="counterparty" maxlength="100"></div>
      <div class="field"><label for="txPaymentMethod">收付方式</label><select id="txPaymentMethod" name="paymentMethod"><option value="">請選擇</option><option value="現金">現金</option><option value="轉帳">轉帳</option><option value="其他">其他</option></select></div>
      <div class="field"><label for="txMember">成員繳款對象</label><select id="txMember" name="memberId"></select></div>
      <div class="field full"><span class="helper" id="lunarPreview">選擇國曆日期後顯示農曆</span></div>
      <div class="field full"><label for="txDetails">明細與對象</label><input id="txDetails" name="details" maxlength="300" placeholder="例如：探病水果、某次聚餐"></div>
      <div class="field full"><label for="txNotes">備註</label><textarea id="txNotes" name="notes" maxlength="500"></textarea></div>
      <div class="field full"><label for="txVoucherFile">憑證附件（PDF、JPG、PNG；最多 5 MB）</label><input id="txVoucherFile" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"></div>
      <div class="field full hidden" id="reasonField"><label for="txReason">更正原因 *</label><input id="txReason" name="reason" maxlength="200" placeholder="請說明本次更正原因"></div>
    </div><div class="form-actions"><button type="button" class="btn light" onclick="txDialog.close()">取消</button><button type="submit" class="btn" id="saveButton">儲存紀錄</button></div></form></dialog>
  <div id="status" class="status hidden" role="status"></div>
  <script>
    const state={data:null,accounting:null,analytics:null,view:'home',filters:{},range:{start:'',end:''},importSource:null,importPreview:null,user:null,token:sessionStorage.getItem('ledgerSession')||''};
    const colors=['#529f7f','#d98b78','#e3ae59','#8faed0','#a77eab','#93a77c'];
    const el=id=>document.getElementById(id);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=c=>'NT$ '+(Number(c||0)/100).toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});
    const rawCall=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
    const call=(name,...args)=>rawCall(name,state.token,...args);
    function toast(message,error=false){let box=el('status');box.textContent=message;box.className='status'+(error?' error':'');setTimeout(()=>box.classList.add('hidden'),5500)}
    function fail(error){let message=error&&error.message?error.message:String(error);if(/請先登入|登入已到期|登入已失效/.test(message)){showLogin();message='登入已到期，請重新登入'}toast(message,true)}
    function showLogin(){state.token='';state.user=null;state.data=null;state.accounting=null;state.analytics=null;state.users=null;el('content').replaceChildren();sessionStorage.removeItem('ledgerSession');el('appShell').classList.add('hidden');el('loginScreen').classList.remove('hidden');el('loginPassword').value=''}
    function showApp(user){state.user=user;state.data=null;state.accounting=null;state.analytics=null;state.users=null;el('content').textContent='載入帳本中…';el('loginScreen').classList.add('hidden');el('appShell').classList.remove('hidden');el('account').textContent=user.label+'（'+user.username+'）'}
    async function loginUi(event){event.preventDefault();let button=el('loginButton');button.disabled=true;try{let result=await rawCall('login',el('loginName').value,el('loginPassword').value);state.token=result.token;sessionStorage.setItem('ledgerSession',result.token);showApp(result.user);await refresh()}catch(error){fail(error)}finally{button.disabled=false}}
    async function logoutUi(){try{if(state.token)await call('logout')}catch(e){}showLogin()}
    async function boot(){if(!state.token)return;try{let user=await rawCall('getSessionInfo',state.token);showApp(user);await refresh()}catch(e){showLogin()}}
    function today(){let parts=Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${parts.year}-${parts.month}-${parts.day}`}
    function cents(value){return (Number(value||0)/100).toFixed(2)}
    async function refresh(){try{state.data=await call('getAppData')}catch(error){if(state.user?.role==='OWNER'&&/系統尚未初始化/.test(error?.message||'')){await call('setupProject');state.data=await call('getAppData')}else throw error}state.accounting=await call('getAccountingData');state.analytics=state.data.analytics;if(state.range.start||state.range.end)state.analytics=await call('getAnalytics',state.range.start,state.range.end);render()}
    function setView(view){state.view=view;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render();window.scrollTo(0,0);if(view==='settings'&&state.user?.role==='OWNER')call('listUsers').then(users=>{state.users=users;render()}).catch(fail)}
    function header(kicker,title,subtitle,button=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${subtitle}</p></div>${button}</div>`}
    function txName(t){return t.type==='INCOME'?'收入':'支出'}
    function txLabel(t){let options=t.type==='INCOME'?state.data.incomeCategoryOptions.concat([state.data.legacyIncomeCategory]):state.data.categoryOptions;let code=t.category||(t.type==='INCOME'?state.data.legacyIncomeCategory[0]:'');return code?(options.find(x=>x[0]===code)||['',code])[1]:'—'}
    function dashboard(){
      let d=state.data,t=d.totals,a=state.analytics||d.analytics;
      let list=d.latest.map(x=>`<div class="recent-row"><div><strong>${esc(x.details||txLabel(x))}</strong><small>${esc(x.gregorianDate)} · ${txName(x)} · ${esc(txLabel(x))}</small></div><div class="money ${x.type==='INCOME'?'type-income':'type-expense'}">${x.type==='INCOME'?'+':'−'}${money(x.amountCents)}</div></div>`).join('')||'<div class="empty"><strong>尚無記帳紀錄</strong>新增第一筆收支後就會顯示在這裡。</div>';
      let actions='<div class="dashboard-actions"><button class="btn light" onclick="downloadDashboardCsv()">下載儀表板資料 CSV</button><button class="btn light" onclick="window.print()">列印／存為 PDF</button><button class="btn" onclick="openTransaction()">＋ 新增收支</button></div>';
      return header('FUND OVERVIEW','基金總覽','收支、餘額與分類趨勢一目了然。',actions)+
        `<div class="filters no-print"><div class="field"><label for="dashStart">起始日期</label><input type="date" id="dashStart" value="${esc(state.range.start)}"></div><div class="field"><label for="dashEnd">結束日期</label><input type="date" id="dashEnd" value="${esc(state.range.end)}"></div><button class="btn light" onclick="updateRange('dash')">套用期間</button><button class="btn ghost" onclick="resetDashboardRange()">查看全部</button></div>`+
        `<div class="dashboard-print"><h1 class="dashboard-print-title">基金收支儀表板</h1><div class="muted" style="margin-bottom:12px">統計期間：${esc(state.range.start||'帳本起始')} 至 ${esc(state.range.end||'目前')} · 共 ${a.transactionCount} 筆</div>`+
        `<div class="cards"><section class="card hero"><div class="label">基金現有餘額</div><div class="money bigmoney">${money(t.balanceCents)}</div><div class="sub">全部歷史收入減支出</div></section><section class="card"><div class="label">累計收入</div><div class="money smallmoney">${money(t.incomeCents)}</div></section><section class="card"><div class="label">累計支出</div><div class="money smallmoney">${money(t.expenseCents)}</div></section></div>`+
        `<div class="cards analysis-cards"><section class="card"><div class="label">期間期初</div><div class="money smallmoney">${money(a.openingCents)}</div></section><section class="card"><div class="label">期間收入</div><div class="money smallmoney type-income">${money(a.incomeCents)}</div></section><section class="card"><div class="label">期間支出</div><div class="money smallmoney type-expense">${money(a.expenseCents)}</div></section><section class="card"><div class="label">期間期末</div><div class="money smallmoney">${money(a.closingCents)}</div></section></div>`+
        `<section class="card chart-card"><div class="section-title"><h2>收支趨勢</h2><span class="chart-key"><span>收入</span><span class="expense">支出</span></span></div>${trendChart(a.buckets)}</section>`+
        `<div class="grid2"><section class="card"><div class="section-title"><h2>收入來源</h2></div>${breakdownChart(a.incomeCategories,'收入')}</section><section class="card"><div class="section-title"><h2>支出去向</h2></div>${breakdownChart(a.expenseCategories,'支出')}</section></div></div>`+
        `<section class="card no-print" style="margin-top:18px"><div class="section-title"><h2>最近五筆</h2><button class="btn ghost" onclick="setView('transactions')">查看全部 →</button></div><div class="recent">${list}</div></section>`;
    }
    function filtered(){let f=state.filters;return state.data.transactions.filter(t=>t.status!=='VOID'&&(!f.start||t.gregorianDate>=f.start)&&(!f.end||t.gregorianDate<=f.end)&&(!f.type||t.type===f.type)&&(!f.category||t.category===f.category)&&(!f.keyword||`${t.details} ${t.notes}`.toLowerCase().includes(f.keyword.toLowerCase()))).sort((a,b)=>b.gregorianDate.localeCompare(a.gregorianDate)||b.createdAt.localeCompare(a.createdAt))}
    function formCategoryOptions(type,selected=''){
      let options=type==='INCOME'?state.data.incomeCategoryOptions:state.data.categoryOptions;
      return `<option value="">請選擇${type==='INCOME'?'收入':'支出'}分類</option>`+
        options.map(([code,label])=>`<option value="${code}" ${selected===code?'selected':''}>${esc(label)}</option>`).join('');
    }
    function filterCategoryOptions(selected=''){
      let group=(label,options)=>`<optgroup label="${label}">`+options.map(([code,name])=>`<option value="${code}" ${selected===code?'selected':''}>${esc(name)}</option>`).join('')+'</optgroup>';
      return '<option value="">全部分類</option>'+group('收入',state.data.incomeCategoryOptions.concat([state.data.legacyIncomeCategory]))+group('支出',state.data.categoryOptions);
    }
    function filtersHtml(){let f=state.filters;return `<div class="filters"><div class="field"><label>起始日期</label><input id="filterStart" type="date" value="${esc(f.start||'')}"></div><div class="field"><label>結束日期</label><input id="filterEnd" type="date" value="${esc(f.end||'')}"></div><div class="field"><label>類型</label><select id="filterType"><option value="">全部</option><option value="INCOME" ${f.type==='INCOME'?'selected':''}>收入</option><option value="EXPENSE" ${f.type==='EXPENSE'?'selected':''}>支出</option></select></div><div class="field"><label>收支分類</label><select id="filterCategory">${filterCategoryOptions(f.category)}</select></div><div class="field wide"><label>搜尋明細或備註</label><input id="filterKeyword" value="${esc(f.keyword||'')}" placeholder="姓名、物品、用途"></div><button class="btn" onclick="applyFilters()">查詢</button></div>`}
    function transactions(){let rows=filtered();let desktop=rows.map(t=>`<tr><td>${esc(t.gregorianDate)}</td><td>${esc(t.lunarDate)}</td><td><span class="pill ${t.type==='EXPENSE'?'expense':''}">${txName(t)}</span></td><td class="amount ${t.type==='INCOME'?'type-income':'type-expense'}">${t.type==='INCOME'?'+':'−'}${money(t.amountCents)}</td><td>${esc(txLabel(t))}</td><td>${esc(t.details||'—')}</td><td>${esc(t.notes||'—')}<br><span class="muted">${t.type==='EXPENSE'?(t.reviewStatus==='PENDING'?'待覆核':t.reviewStatus==='APPROVED'?'已覆核':'已退回'):'—'}</span></td><td class="actions"><div class="row-actions"><button onclick="openTransaction('${t.id}')">更正</button><button onclick="voidTx('${t.id}')">作廢</button>${t.documentUrl?`<button onclick="viewVoucher('${t.id}')">憑證</button>`:''}</div></td></tr>`).join('');let mobile=rows.map(t=>`<div class="mobile-tx"><div class="top"><div><span class="pill ${t.type==='EXPENSE'?'expense':''}">${txName(t)}</span> <strong>${esc(t.details||txLabel(t))}</strong><div class="muted">${esc(t.gregorianDate)} · ${esc(t.lunarDate)}</div></div><div class="money ${t.type==='INCOME'?'type-income':'type-expense'}">${t.type==='INCOME'?'+':'−'}${money(t.amountCents)}</div></div><div class="bottom"><small>${esc(txLabel(t))}${t.notes?' · '+esc(t.notes):''}</small><span class="row-actions"><button onclick="openTransaction('${t.id}')">更正</button><button onclick="voidTx('${t.id}')">作廢</button>${t.documentUrl?`<button onclick="viewVoucher('${t.id}')">憑證</button>`:''}</span></div></div>`).join('');return header('TRANSACTIONS','收支明細',`共 ${rows.length} 筆符合條件的紀錄。`,`<button class="btn" onclick="openTransaction()">＋ 新增收支</button>`)+filtersHtml()+`<div class="table-wrap"><table><thead><tr><th>國曆日期</th><th>農曆日期</th><th>類型</th><th style="text-align:right">金額</th><th>分類</th><th>明細與對象</th><th>備註／覆核</th><th>操作</th></tr></thead><tbody>${desktop||'<tr><td colspan="8" class="empty">沒有符合條件的紀錄</td></tr>'}</tbody></table></div><div class="mobile-list">${mobile||'<div class="empty">沒有符合條件的紀錄</div>'}</div>`}
    async function updateRange(prefix){
      let start=el(prefix+'Start').value,end=el(prefix+'End').value;
      if(start&&end&&start>end){toast('起始日期不可晚於結束日期',true);return}
      state.range={start,end};
      try{state.analytics=await call('getAnalytics',start,end)}catch(error){fail(error);return}
      render();
    }
    function resetDashboardRange(){state.range={start:'',end:''};state.analytics=state.data.analytics;render()}
    function trendChart(buckets){
      if(!buckets.length)return '<div class="empty"><strong>此期間尚無收支紀錄</strong>新增紀錄後會顯示每月趨勢。</div>';
      let max=Math.max(1,...buckets.flatMap(b=>[b.incomeCents,b.expenseCents]));
      let bars=buckets.map(b=>`<div class="trend-group"><div class="trend-columns"><div class="trend-bar income" style="height:${b.incomeCents?Math.max(2,b.incomeCents/max*100):0}%" title="${esc(b.key)} 收入 ${money(b.incomeCents)}" aria-label="${esc(b.key)} 收入 ${money(b.incomeCents)}"></div><div class="trend-bar expense" style="height:${b.expenseCents?Math.max(2,b.expenseCents/max*100):0}%" title="${esc(b.key)} 支出 ${money(b.expenseCents)}" aria-label="${esc(b.key)} 支出 ${money(b.expenseCents)}"></div></div><small>${esc(b.key)}</small></div>`).join('');
      let rows=buckets.map(b=>`<tr><td>${esc(b.key)}</td><td>${money(b.incomeCents)}</td><td>${money(b.expenseCents)}</td><td>${money(b.incomeCents-b.expenseCents)}</td></tr>`).join('');
      return `<div class="trend-scroll"><div class="trend-chart" role="img" aria-label="各期間收入與支出長條圖">${bars}</div></div><div class="trend-scroll"><table class="trend-table"><thead><tr><th>期間</th><th>收入</th><th>支出</th><th>收支差額</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    function breakdownChart(items,label){
      let sum=items.reduce((s,x)=>s+x.amountCents,0);
      if(!sum)return `<div class="empty"><strong>此期間沒有${label}</strong>選擇其他日期或新增紀錄。</div>`;
      let offset=0;
      let circles=items.map((x,i)=>{let percent=x.amountCents/sum*100;let part=`<circle cx="95" cy="95" r="72" fill="none" stroke="${colors[i%colors.length]}" stroke-width="24" stroke-dasharray="${percent} ${100-percent}" stroke-dashoffset="${-offset}" pathLength="100" transform="rotate(-90 95 95)"></circle>`;offset+=percent;return part}).join('');
      let legend=items.map((x,i)=>`<div class="legend-row"><span class="swatch" style="background:${colors[i%colors.length]}"></span><span>${esc(x.label)} <span class="muted">${(x.amountCents/sum*100).toFixed(1)}%</span></span><strong class="money">${money(x.amountCents)}</strong></div>`).join('');
      return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 190 190" role="img" aria-label="${label}分類比例圖">${circles}<text x="95" y="90" text-anchor="middle" font-size="12" fill="#705e55">${label}合計</text><text x="95" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#49342e">${esc(money(sum))}</text></svg><div class="legend">${legend}</div></div>`;
    }
    function downloadDashboardCsv(){
      let a=state.analytics||state.data.analytics;
      let lines=[['基金收支儀表板'],['起始日期',state.range.start||'帳本起始'],['結束日期',state.range.end||'目前'],['歷史現有餘額',cents(state.data.totals.balanceCents)],['期間期初',cents(a.openingCents)],['期間收入',cents(a.incomeCents)],['期間支出',cents(a.expenseCents)],['期間期末',cents(a.closingCents)],[],['期間','收入','支出','收支差額']];
      a.buckets.forEach(b=>lines.push([b.key,cents(b.incomeCents),cents(b.expenseCents),cents(b.incomeCents-b.expenseCents)]));
      lines.push([],['收入類別','金額','占比']);
      a.incomeCategories.forEach(x=>lines.push([x.label,cents(x.amountCents),a.incomeCents?(x.amountCents/a.incomeCents*100).toFixed(1)+'%':'0%']));
      lines.push([],['支出類別','金額','占比']);
      a.expenseCategories.forEach(x=>lines.push([x.label,cents(x.amountCents),a.expenseCents?(x.amountCents/a.expenseCents*100).toFixed(1)+'%':'0%']));
      let csv='\uFEFF'+lines.map(row=>row.map(value=>'"'+String(value??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
      let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
      let link=document.createElement('a');link.href=url;link.download='基金儀表板_'+today()+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    function report(){let f=state.range;let active=state.data.transactions.filter(t=>t.status!=='VOID');let opening=f.start?active.filter(t=>t.gregorianDate<f.start).reduce((s,t)=>s+(t.type==='INCOME'?1:-1)*t.amountCents,0):0;let rows=active.filter(t=>(!f.start||t.gregorianDate>=f.start)&&(!f.end||t.gregorianDate<=f.end)).sort((a,b)=>a.gregorianDate.localeCompare(b.gregorianDate)||a.createdAt.localeCompare(b.createdAt));let income=rows.filter(t=>t.type==='INCOME').reduce((s,t)=>s+Number(t.amountCents),0);let expense=rows.filter(t=>t.type==='EXPENSE').reduce((s,t)=>s+Number(t.amountCents),0);return header('A4 REPORT','收支報表','選擇期間後可列印 A4，或在列印視窗中另存為 PDF。',`<button class="btn no-print" onclick="window.print()">列印 A4／存為 PDF</button>`)+`<div class="filters no-print"><div class="field"><label>起始日期</label><input id="reportStart" type="date" value="${esc(f.start)}"></div><div class="field"><label>結束日期</label><input id="reportEnd" type="date" value="${esc(f.end)}"></div><button class="btn light" onclick="updateRange('report')">更新報表</button></div><article class="report-paper"><h1>基金收支明細表</h1><div class="report-meta">統計期間：${esc(f.start||'帳本起始')} 至 ${esc(f.end||'目前')}　｜　幣別：新臺幣</div><div class="report-summary"><div><span>期初餘額</span><strong>${money(opening)}</strong></div><div><span>期間收入</span><strong>${money(income)}</strong></div><div><span>期間支出</span><strong>${money(expense)}</strong></div><div><span>期末餘額</span><strong>${money(opening+income-expense)}</strong></div></div><div class="report-scroll"><table class="report-table"><thead><tr><th>國曆</th><th>農曆</th><th>類型／分類</th><th>金額</th><th>明細／備註</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.gregorianDate)}</td><td>${esc(t.lunarDate)}</td><td>${txName(t)} · ${esc(txLabel(t))}${t.reviewStatus==='PENDING'?'（待覆核）':''}</td><td>${t.type==='INCOME'?'+':'−'}${money(t.amountCents)}</td><td>${esc(t.details||'—')}${t.notes?'<br><span class="muted">'+esc(t.notes)+'</span>':''}</td></tr>`).join('')||'<tr><td colspan="5">此期間沒有收支紀錄</td></tr>'}</tbody></table></div><div class="report-foot">報表產生時間：${esc(new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',dateStyle:'medium',timeStyle:'short'}).format(new Date()))}</div></article>`}
    function importPage(){let p=state.importPreview;return header('IMPORT','舊帳匯入','先對照範本整理舊帳；系統會在寫入前檢查格式、重複紀錄及核定餘額。')+`<section class="card" style="max-width:780px"><div class="section-title"><h2>準備舊帳資料</h2><button class="btn light" onclick="downloadTemplate()">下載 CSV 範本</button></div><p class="muted">Excel 請先轉為 Google 試算表，或另存為 UTF-8 CSV。欄位：externalId、type、gregorianDate、amount、category、details、notes。收入可選成員繳款、捐款、活動收入、利息／回饋或其他收入；舊帳空白收入分類會列為「未分類收入（舊帳）」。每次最多 1000 筆。</p><div class="form-grid"><div class="field full"><label>來源</label><select id="importKind" onchange="toggleImportSource()" ${p?'disabled':''}><option value="csv">CSV 檔</option><option value="sheet">Google 試算表</option></select></div><div class="field full" id="csvField"><label>選擇 CSV 檔</label><input id="importFile" type="file" accept=".csv,text/csv" ${p?'disabled':''}></div><div class="field full hidden" id="sheetField"><label>Google 試算表網址或 ID</label><input id="importSheet" placeholder="請貼上試算表網址" ${p?'disabled':''}></div><div class="field full"><label>原始帳本核定的匯入後餘額（新臺幣）*</label><input id="expectedBalance" inputmode="decimal" placeholder="例如 12850.00"><span class="helper">如舊帳涵蓋完整歷史，請填舊帳期末餘額；已在系統中的交易也會計入。</span></div></div><div class="form-actions"><button class="btn" onclick="previewImportUi()">檢查並預覽</button></div>${p?`<div class="notice ${p.errors.length||!p.reconciled?'error':''}"><strong>${p.errors.length||!p.reconciled?'尚未通過檢查':'可匯入'}</strong><br>可匯入 ${p.count} 筆 · 收入 ${money(p.incomeCents)} · 支出 ${money(p.expenseCents)}<br>目前餘額 ${money(p.currentBalanceCents)} → 預計餘額 ${money(p.projectedBalanceCents)}<br>核定餘額 ${p.expectedBalanceCents===null?'未填寫':money(p.expectedBalanceCents)}${p.errors.length?'<br>'+p.errors.slice(0,10).map(e=>'第 '+e.row+' 列：'+esc(e.message)).join('<br>'):''}</div><div class="row-actions"><button class="btn" ${p.errors.length||!p.reconciled||!p.count?'disabled':''} onclick="commitImportUi()">確認匯入 ${p.count} 筆</button><button class="btn light" onclick="cancelImportPreview()">取消預覽</button></div>`:''}</section>`}
    function optionsHtml(items,selected){return items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}
    function accountingPage(){let a=state.accounting||{},accounts=a.accounts||[],funds=a.funds||[],members=a.memberDues||[],budgets=a.budgets||[],owner=state.user?.role==='OWNER';let accOpts=optionsHtml(accounts),fundOpts=optionsHtml(funds);let catOpts=(state.data?.categoryOptions||[]).map(([code,label])=>`<option value="${esc(code)}">${esc(label)}</option>`).join('');let pending=(a.pending||[]).map(tx=>`<div class="recent-row"><div><strong>${esc(tx.details||'支出')}</strong><small>${esc(tx.gregorianDate)} · 提交者 ${esc(tx.submittedBy||'舊帳')}</small></div><div><strong class="money">${money(tx.amountCents)}</strong><div class="row-actions">${tx.submittedBy!==state.user?.username?`<button class="btn light" onclick="reviewUi('${tx.id}',true)">核准</button><button class="btn ghost" onclick="reviewUi('${tx.id}',false)">退回</button>`:'<span class="muted">等待另一位管理人覆核</span>'}</div></div></div>`).join('')||'<div class="empty">目前沒有待覆核支出</div>';let closures=(a.closures||[]).map(x=>`<div class="recent-row"><span>已結帳至 ${esc(x.throughDate)} · ${esc(x.actor)}</span>${owner?`<button class="btn ghost" onclick="reopenUi('${x.id}')">重新開帳</button>`:''}</div>`).join('')||'<p class="muted">尚未結帳</p>';return header('ACCOUNTING','會計管理','對帳、覆核、基金用途與期間結帳。',owner?'<button class="btn light" onclick="downloadLedgerBackup()">下載帳本資料備份</button>':'')+`<section class="card"><div class="section-title"><h2>待覆核支出</h2><span class="pill expense">${(a.pending||[]).length} 筆</span></div>${pending}</section><div class="grid2"><section class="card"><h2>現金與銀行帳戶</h2>${accounts.map(x=>`<div class="recent-row"><strong>${esc(x.name)}</strong><strong class="money">${money(x.balanceCents)}</strong></div>`).join('')}<h3>記錄實際餘額</h3><form onsubmit="accountingSubmit(event,'reconcileAccount')"><div class="form-grid"><div class="field"><label>帳戶</label><select name="accountId">${accOpts}</select></div><div class="field"><label>對帳日</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>實際餘額</label><input name="actualBalance" inputmode="decimal" required></div><div class="field"><label>差異說明</label><input name="note"></div></div><button class="btn" type="submit">儲存對帳</button></form>${(a.reconciliations||[]).slice(0,4).map(x=>`<p class="muted">${esc(x.date)} · ${esc(accounts.find(y=>y.id===x.accountId)?.name||x.accountId)}：帳面 ${money(x.bookCents)}，實際 ${money(x.actualCents)}，差異 <strong class="${x.differenceCents?'reconcile-bad':'reconcile-good'}">${money(x.differenceCents)}</strong></p>`).join('')}</section><section class="card"><h2>帳戶間轉帳</h2><p class="muted">只移動現金與銀行存款，不列入收入或支出。</p><form onsubmit="accountingSubmit(event,'recordTransfer')"><div class="form-grid"><div class="field"><label>日期</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>金額</label><input name="amount" inputmode="decimal" required></div><div class="field"><label>轉出帳戶</label><select name="fromAccountId">${accOpts}</select></div><div class="field"><label>轉入帳戶</label><select name="toAccountId">${accOpts}</select></div><div class="field full"><label>說明</label><input name="details"></div></div><button class="btn" type="submit">記錄轉帳</button></form>${owner?`<h3>新增帳戶</h3><form onsubmit="simpleCreate(event,'createAccount')"><div class="field"><label>帳戶名稱</label><input name="name" maxlength="40" required></div><button class="btn light" type="submit">新增帳戶</button></form>`:''}</section></div><div class="grid2"><section class="card"><h2>基金用途</h2>${funds.map(x=>`<div class="recent-row"><span>${esc(x.name)}${x.restricted?' · 指定用途':''}</span><strong class="money">${money(x.balanceCents)}</strong></div>`).join('')}${owner?`<h3>新增基金</h3><form onsubmit="createFundUi(event)"><div class="field"><label>基金名稱</label><input name="name" maxlength="40" required></div><label><input name="restricted" type="checkbox"> 指定用途基金</label><br><button class="btn light" type="submit">新增基金</button></form><h3>基金調撥</h3><form onsubmit="accountingSubmit(event,'transferFund')"><div class="form-grid"><div class="field"><label>日期</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>金額</label><input name="amount" required></div><div class="field"><label>來源基金</label><select name="fromFundId">${fundOpts}</select></div><div class="field"><label>目的基金</label><select name="toFundId">${fundOpts}</select></div><div class="field full"><label>調撥原因</label><input name="reason" required></div></div><button class="btn light" type="submit">記錄調撥</button></form>`:''}</section><section class="card"><h2>本月成員繳款 · ${esc(a.month||'')}</h2>${members.map(x=>`<div class="recent-row"><span>${esc(x.name)}<small> · 應繳 ${money(x.dueCents)}</small></span><strong class="money ${x.balanceCents>0?'reconcile-bad':'reconcile-good'}">已繳 ${money(x.paidCents)}</strong></div>`).join('')||'<p class="muted">尚未建立成員名單</p>'}${owner?`<h3>新增成員</h3><form onsubmit="createMemberUi(event)"><div class="field"><label>成員姓名</label><input name="name" maxlength="50" required></div><div class="field"><label>每月應繳金額（可留空）</label><input name="monthlyDue" inputmode="decimal"></div><button class="btn light" type="submit">新增成員</button></form>`:''}</section></div><div class="grid2"><section class="card"><h2>支出預算</h2>${budgets.map(x=>`<div class="recent-row"><div><strong>${esc(funds.find(f=>f.id===x.fundId)?.name||'基金')} · ${esc((state.data.categoryOptions.find(c=>c[0]===x.category)||[])[1]||x.category)}</strong><small>${esc(x.start)} 至 ${esc(x.end)}</small></div><div class="money">${money(x.actualCents)} / ${money(x.amountCents)}</div></div>`).join('')||'<p class="muted">尚未設定預算</p>'}${owner?`<form onsubmit="accountingSubmit(event,'setBudget')"><div class="form-grid"><div class="field"><label>起日</label><input name="start" type="date" required></div><div class="field"><label>迄日</label><input name="end" type="date" required></div><div class="field"><label>基金</label><select name="fundId">${fundOpts}</select></div><div class="field"><label>支出分類</label><select name="category">${catOpts}</select></div><div class="field"><label>預算金額</label><input name="amount" required></div></div><button class="btn light" type="submit">設定預算</button></form>`:''}</section><section class="card"><h2>期間結帳</h2><p class="muted">結帳前，所有支出須完成覆核，各帳戶須在結帳日完成零差異對帳。</p>${closures}${owner?`<form onsubmit="closePeriodUi(event)"><div class="field"><label>結帳至</label><input name="throughDate" type="date" required></div><button class="btn" type="submit">完成結帳</button></form>`:''}</section></div>`}
    async function accountingSubmit(event,name){event.preventDefault();let data=Object.fromEntries(new FormData(event.target).entries());try{await call(name,data);await refresh();toast('已儲存')}catch(e){fail(e)}}
    async function simpleCreate(event,name){event.preventDefault();try{await call(name,event.target.elements.name.value);await refresh();toast('已新增')}catch(e){fail(e)}}
    async function createFundUi(event){event.preventDefault();let f=event.target;try{await call('createFund',f.elements.name.value,f.elements.restricted.checked);await refresh();toast('基金已新增')}catch(e){fail(e)}}
    async function createMemberUi(event){event.preventDefault();let f=event.target;try{await call('createMember',f.elements.name.value,f.elements.monthlyDue.value);await refresh();toast('成員已新增')}catch(e){fail(e)}}
    async function reviewUi(id,approved){let reason=approved?'':prompt('請填退回原因');if(!approved&&reason===null)return;try{await call('reviewTransaction',id,approved,reason);await refresh();toast(approved?'支出已核准':'支出已退回並作廢')}catch(e){fail(e)}}
    async function closePeriodUi(event){event.preventDefault();try{await call('closePeriod',event.target.elements.throughDate.value);await refresh();toast('期間已結帳')}catch(e){fail(e)}}
    async function reopenUi(id){let reason=prompt('請填重新開帳原因');if(reason===null)return;try{await call('reopenPeriod',id,reason);await refresh();toast('期間已重新開帳')}catch(e){fail(e)}}
    async function downloadLedgerBackup(){try{let data=await call('exportLedgerData');let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let link=document.createElement('a');link.href=url;link.download='基金帳本資料_'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){fail(e)}}
    function settingsPage(){let isOwner=state.user?.role==='OWNER';let co=(state.users||[]).find(x=>x.role==='MANAGER');return header('ACCOUNT','帳號設定','密碼由您自行更換；更換後原登入會失效。')+`<div class="settings-grid"><section class="card"><h2>更換我的密碼</h2><p class="muted">${esc(state.user?.label||'')} · ${esc(state.user?.username||'')}</p><form onsubmit="changeOwnPasswordUi(event)"><div class="field"><label for="currentPassword">目前密碼</label><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">新密碼（至少 16 字）</label><input id="newPassword" type="password" minlength="16" maxlength="128" autocomplete="new-password" required></div><button class="btn" type="submit">更新我的密碼</button></form></section>${isOwner?`<section class="card"><h2>共同管理人</h2><p class="muted">${co?esc(co.username)+' · '+(co.enabled?'使用中':'已停用'):'載入中…'}</p><form onsubmit="setCoPasswordUi(event)"><div class="field"><label for="coPassword">設定共同管理人新密碼</label><input id="coPassword" type="password" minlength="16" maxlength="128" autocomplete="new-password" required></div><button class="btn" type="submit">重設共同管理人密碼</button></form>${co?`<button class="btn light" onclick="toggleCoUser(${co.enabled?'false':'true'})">${co.enabled?'停用':'啟用'}共同管理人帳號</button>`:''}</section>`:''}</div>`}
    async function changeOwnPasswordUi(event){event.preventDefault();try{await call('changePassword',el('currentPassword').value,el('newPassword').value);showLogin();toast('密碼已更新，請重新登入')}catch(e){fail(e)}}
    async function setCoPasswordUi(event){event.preventDefault();try{await call('setUserPassword','coadmin',el('coPassword').value);el('coPassword').value='';toast('共同管理人密碼已更新')}catch(e){fail(e)}}
    async function toggleCoUser(enabled){try{await call('setUserEnabled','coadmin',enabled);state.users=await call('listUsers');render();toast(enabled?'共同管理人已啟用':'共同管理人已停用')}catch(e){fail(e)}}
    function render(){if(!state.data)return;let map={home:dashboard,transactions,accounting:accountingPage,report,import:importPage,settings:settingsPage};el('content').innerHTML=map[state.view]();}
    function applyFilters(){let start=el('filterStart').value,end=el('filterEnd').value;if(start&&end&&start>end){toast('起始日期不可晚於結束日期',true);return}state.filters={start,end,type:el('filterType').value,category:el('filterCategory').value,keyword:el('filterKeyword').value.trim()};render()}
    function toggleCategory(selected=''){let type=el('txType').value;el('categoryLabel').textContent=(type==='INCOME'?'收入':'支出')+'分類 *';el('txCategory').innerHTML=formCategoryOptions(type,selected);el('txCategory').required=true}
    function openTransaction(id=''){let t=id?state.data.transactions.find(x=>x.id===id):null;let f=el('txForm');f.reset();f.elements.id.value=t?.id||'';f.elements.type.value=t?.type||'INCOME';f.elements.gregorianDate.value=t?.gregorianDate||today();f.elements.amount.value=t?cents(t.amountCents):'';toggleCategory(t?.category||'');f.elements.accountId.innerHTML=(state.accounting?.accounts||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');f.elements.accountId.value=t?.accountId||'CASH';f.elements.fundId.innerHTML=(state.accounting?.funds||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');f.elements.fundId.value=t?.fundId||'GENERAL';f.elements.memberId.innerHTML='<option value="">不指定成員</option>'+(state.accounting?.members||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');f.elements.memberId.value=t?.memberId||'';f.elements.voucherNo.value=t?.voucherNo||'';f.elements.counterparty.value=t?.counterparty||'';f.elements.paymentMethod.value=t?.paymentMethod||'';f.elements.details.value=t?.details||'';f.elements.notes.value=t?.notes||'';f.elements.reason.value='';el('dialogHeading').textContent=t?'更正收支紀錄':'新增收支紀錄';el('reasonField').classList.toggle('hidden',!t);f.elements.reason.required=!!t;el('lunarPreview').textContent=t?'農曆：'+t.lunarDate:'農曆換算中…';el('txDialog').showModal();if(!t)updateLunar()}
    async function updateLunar(){try{let date=el('txDate').value;if(date)el('lunarPreview').textContent='農曆：'+await call('getLunarDate',date)}catch(e){el('lunarPreview').textContent='農曆換算失敗：'+e.message}}
    async function fileBase64(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('無法讀取憑證檔案'));reader.readAsDataURL(file)})}
    async function saveTx(event){event.preventDefault();let f=event.target;let input=Object.fromEntries(new FormData(f).entries());let file=el('txVoucherFile').files[0];if(file&&file.size>5000000){toast('憑證檔案不可超過 5 MB',true);return}el('saveButton').disabled=true;try{let saved=await call('saveTransaction',input);el('txDialog').close();let attachmentError=null;if(file){try{await call('uploadVoucher',saved.id,file.name,file.type,await fileBase64(file))}catch(error){attachmentError=error}}await refresh();toast(attachmentError?'收支已儲存，但憑證上傳失敗：'+attachmentError.message:input.id?'更正已儲存並記錄原因':'收支已新增')}catch(e){fail(e)}finally{el('saveButton').disabled=false}}
    async function viewVoucher(id){try{let file=await call('readVoucher',id);let bytes=Uint8Array.from(atob(file.base64),c=>c.charCodeAt(0));let url=URL.createObjectURL(new Blob([bytes],{type:file.mimeType}));window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){fail(e)}}
    async function voidTx(id){let reason=prompt('請輸入作廢原因：');if(reason===null)return;if(!reason.trim()){toast('作廢原因不可空白',true);return}if(!confirm('確定作廢此筆紀錄？餘額將重新計算。'))return;try{await call('voidTransaction',id,reason);await refresh();toast('紀錄已作廢')}catch(e){fail(e)}}
    function downloadTemplate(){let csv='\uFEFFexternalId,type,gregorianDate,amount,category,details,notes\r\n001,INCOME,2026-10-18,1000,成員繳款,成員繳款,\r\n002,EXPENSE,2026-10-18,120,活動物資,活動用品採購,\r\n';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='基金舊帳匯入範本.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    function toggleImportSource(){let sheet=el('importKind').value==='sheet';el('csvField').classList.toggle('hidden',sheet);el('sheetField').classList.toggle('hidden',!sheet)}
    async function readImportSource(){if(el('importKind').value==='sheet')return {kind:'sheet',sheetId:el('importSheet').value.trim()};let file=el('importFile').files[0];if(!file)throw new Error('請選擇 CSV 檔');if(file.size>250000)throw new Error('CSV 不可超過 250 KB');return {kind:'csv',csv:await file.text()}}
    async function previewImportUi(){try{let source=await readImportSource(),expected=el('expectedBalance').value;state.importSource=source;state.importPreview=await call('previewImport',source,expected);render();el('expectedBalance').value=expected;if(source.kind==='sheet'){el('importKind').value='sheet';toggleImportSource();el('importSheet').value=source.sheetId}else{toast('預覽完成；確認匯入前請勿更換來源檔案')} }catch(e){fail(e)}}
    function cancelImportPreview(){state.importPreview=null;state.importSource=null;render()}
    async function commitImportUi(){try{if(!state.importSource||!state.importPreview)throw new Error('請先預覽匯入');let expected=el('expectedBalance').value;let result=await call('commitImport',state.importSource,expected,true);state.importPreview=null;state.importSource=null;await refresh();toast('已匯入 '+result.count+' 筆，並完成餘額核對')}catch(e){fail(e)}}
    document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
    el('txForm').addEventListener('submit',saveTx);el('txType').addEventListener('change',()=>toggleCategory(''));el('txDate').addEventListener('change',updateLunar);
    el('loginForm').addEventListener('submit',loginUi);
    boot().catch(fail);
  </script>
</body>
</html>
